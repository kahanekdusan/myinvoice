name: Publish Docker image

# Spustí se při push tagu vX.Y.Z (production release)
# nebo manuálně z UI (workflow_dispatch — pro testování).
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Manuální tag (např. test, edge, 1.2.0-rc1)'
        required: true
        default: 'edge'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # = radekhulan/myinvoice

# Strategie multi-arch buildu:
#   1) `build` job běží matrixově per platforma na native runneru (amd64 = ubuntu-latest,
#      arm64 = ubuntu-24.04-arm — free hosted od 2025 pro public repos). Každý job
#      pushne single-arch image jen pomocí digestu (--push-by-digest, bez tagů).
#   2) `merge` job stáhne digesty obou platforem a vytvoří manifest list se všemi
#      semver tagy (1.3.0, 1.3, latest). Bez QEMU = ~5-8 min total místo 28 min.
#
# Image se staví z `Dockerfile.alpine` (php:8.5-fpm-alpine + nginx) — ~136 MB, méně RAM.
# `Dockerfile` (Debian/Apache) zůstává v repu jako lokální fallback, CI ho NEpublikuje.
# Rollback na Debian: pinni starší version tag (≤ v4.31.0) nebo build z `Dockerfile` lokálně.
jobs:
  build:
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write     # nutné pro push do ghcr.io
      actions: read

    steps:
      - name: Prepare platform pair
        # `linux/amd64` → `linux-amd64` (bezpečné jako identifikátor artefaktu / cache scope)
        run: echo "PLATFORM_PAIR=${{ matrix.platform }}" | sed 's|/|-|' >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Require successful CI for the exact production commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: python3 ops/security/require-production-ci.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=MyInvoice.cz
            org.opencontainers.image.description=Czech invoicing system (PHP 8.5 + Vue 3 + MariaDB), multi-supplier — alpine/nginx
            org.opencontainers.image.vendor=MyWebdesign.cz s.r.o.
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Prepare checked build context
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo poppler-utils
          python3 ops/security/install-gitleaks.py "$RUNNER_TEMP/gitleaks"
          PATH="$RUNNER_TEMP:$PATH" python3 ops/security/delivery-check.py context "$RUNNER_TEMP/image-context"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build image locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: ${{ runner.temp }}/image-context
          outputs: type=oci,dest=${{ runner.temp }}/image.tar,compression=gzip
          provenance: false
          sbom: false
          file: ${{ runner.temp }}/image-context/Dockerfile.alpine
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify manifest, config and every image layer
        id: verified
        run: |
          digest=$(python3 ops/security/delivery-check.py image "$RUNNER_TEMP/image.tar" "$RUNNER_TEMP/image-context")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the verified platform image
        env:
          DIGEST: ${{ steps.verified.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="$REGISTRY/$IMAGE_NAME"
          skopeo copy --preserve-digests "oci-archive:$RUNNER_TEMP/image.tar" "docker://$image@$DIGEST"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [build]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Vytvoří tags podle eventu:
      # - tag push v1.2.3 → image tagy: 1.2.3, 1.2, latest
      # - workflow_dispatch → image tag: <input>
      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  # Production bundle — full deployable tar.gz s vendor/, web/dist/,
  # manual/generated/, manual/manual.pdf — uploadne jako release asset.
  # Slouží pro „native auto-update" (UI v Settings → Aktualizace stáhne
  # tarball a rozbalí ho přes hostingy bez Composer / Node).
  bundle:
    runs-on: ubuntu-latest
    # Re-enable only after independent review of the allowlist and a check
    # that verifies the assembled archive before uploading it.
    if: ${{ false }}
    permissions:
      contents: write   # nutné pro upload release asset

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, gd, intl, zip, pdo_mysql, exif, bcmath
          coverage: none
          tools: composer:v2

      - name: Set up Node + pnpm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          # Pin na konkrétní verzi (shoda s lokálem) — `latest` vytáhlo pnpm 11.12.0,
          # které padá při čtení pnpm-lock.yaml v9.0 („Cannot use 'in' operator to
          # search for 'integrity' in undefined"). 11.13.0 upstream označil za broken
          # release (ERR_PNPM_BROKEN_PNPM_RELEASE), instalace od té doby tvrdě padá.
          # 11.18.0 = verze používaná lokálně, s lockfile v9.0 ověřeně funkční.
          version: 11.18.0

      - name: Composer install (production)
        working-directory: api
        run: composer install --no-dev --no-progress --no-interaction --prefer-dist --optimize-autoloader

      - name: pnpm install + build
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Generate manual (HTML + PDF)
        run: |
          php tools/generateManualHtml.php
          php tools/exportManualToPdf.php

      - name: Tag from ref
        id: tag
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build production bundle tarball
        # Vyloučí: .git, .github, source/, node_modules, api/vendor.prod (cache),
        # api/.phpunit.cache, api/tests, log/, storage/, private/, cfg.*, web/src.
        # Zahrne: api/vendor/, web/dist/, manual/ (vč. manual.pdf), root soubory.
        #
        # Pozn.: tarball se píše do /tmp, ne do CWD — jinak tar detekuje, že
        # archiv sám sebe modifikuje během čtení ("file changed as we read it",
        # exit 1), protože CWD je `.` v archivu.
        run: |
          BUNDLE="myinvoice-${{ steps.tag.outputs.tag }}.tar.gz"
          TMP_BUNDLE="/tmp/$BUNDLE"
          tar -czf "$TMP_BUNDLE" \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./source' \
            --exclude='./node_modules' \
            --exclude='./api/vendor.prod' \
            --exclude='./api/.phpunit.cache' \
            --exclude='./api/tests' \
            --exclude='./log/*' \
            --exclude='./storage/*' \
            --exclude='./private/*' \
            --exclude='./cfg.php' \
            --exclude='./cfg.local.php' \
            --exclude='./cfg.docker.php' \
            --exclude='./.env' \
            --exclude='./web/src' \
            --exclude='./web/node_modules' \
            --exclude='./web/public' \
            --exclude='./web/index.html' \
            --exclude='./web/package.json' \
            --exclude='./web/pnpm-lock.yaml' \
            --exclude='./web/tsconfig*.json' \
            --exclude='./web/vite.config.ts' \
            --exclude='./web/eslint.config.js' \
            --exclude='*.log' \
            --transform "s,^\./,myinvoice-${{ steps.tag.outputs.tag }}/," \
            .
          mv "$TMP_BUNDLE" "$BUNDLE"
          ls -lh "$BUNDLE"
          sha256sum "$BUNDLE" > "$BUNDLE.sha256"
          echo "BUNDLE=$BUNDLE" >> "$GITHUB_ENV"

      - name: Upload bundle to release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            ${{ env.BUNDLE }}
            ${{ env.BUNDLE }}.sha256
