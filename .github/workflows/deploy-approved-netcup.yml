name: Deploy approved MyInvoice image to Netcup

on:
  push:
    branches: [production]
    paths: [ops/deploy/netcup-release.json]

concurrency:
  group: myinvoice-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify approved release identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      revision: ${{ steps.release.outputs.revision }}
      digest: ${{ steps.release.outputs.digest }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact successful CI and build on production
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          request=ops/deploy/netcup-release.json
          revision=$(jq -er '.revision' "$request")
          digest=$(jq -er '.digest' "$request")
          version=$(jq -er '.version' "$request")
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor "$revision" HEAD
          [[ "$(git show "$revision:VERSION" | tr -d '\r\n')" == "$version" ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=production&head_sha=$revision&status=success" \
            | jq -e --arg revision "$revision" 'any(.workflow_runs[]; .head_sha == $revision and .event == "push" and .conclusion == "success")' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build-netcup-production.yml/runs?branch=production&head_sha=$revision&status=success" \
            | jq -e --arg revision "$revision" 'any(.workflow_runs[]; .head_sha == $revision and .event == "push" and .conclusion == "success")' >/dev/null
          # Resolve the registry tag published by the verified build and compare its digest.
          export DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          published=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' \
            "ghcr.io/kahanekdusan/myinvoice:sha-$revision")
          [[ "$published" == "$digest" ]]
          printf 'revision=%s\ndigest=%s\nversion=%s\n' "$revision" "$digest" "$version" >> "$GITHUB_OUTPUT"

  deploy-candidate:
    name: Deploy inactive candidate on srv01
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment: netcup-myinvoice-candidate
    steps:
      - name: Configure verified SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.NETCUP_MYINVOICE_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.NETCUP_MYINVOICE_SSH_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/netcup_myinvoice
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/netcup_myinvoice ~/.ssh/known_hosts

      - name: Deploy immutable image to inactive slot only
        env:
          DEPLOY_HOST: ${{ vars.NETCUP_MYINVOICE_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.NETCUP_MYINVOICE_DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.NETCUP_MYINVOICE_DEPLOY_USER || 'deploy-myinvoice' }}
          IMAGE_REF: ghcr.io/kahanekdusan/myinvoice@${{ needs.verify.outputs.digest }}
          SOURCE_SHA: ${{ needs.verify.outputs.revision }}
        run: |
          test -n "$DEPLOY_HOST"
          ssh -i ~/.ssh/netcup_myinvoice -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo /usr/local/sbin/netcup-myinvoice-deploy candidate '$IMAGE_REF' '$SOURCE_SHA'"

  promote-production:
    name: Promote candidate to live production
    needs: [verify, deploy-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment: netcup-myinvoice-production
    steps:
      - name: Configure verified SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.NETCUP_MYINVOICE_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.NETCUP_MYINVOICE_SSH_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/netcup_myinvoice
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/netcup_myinvoice ~/.ssh/known_hosts

      - name: Promote the exact healthy candidate
        env:
          DEPLOY_HOST: ${{ vars.NETCUP_MYINVOICE_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.NETCUP_MYINVOICE_DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.NETCUP_MYINVOICE_DEPLOY_USER || 'deploy-myinvoice' }}
          IMAGE_REF: ghcr.io/kahanekdusan/myinvoice@${{ needs.verify.outputs.digest }}
          SOURCE_SHA: ${{ needs.verify.outputs.revision }}
        run: |
          test -n "$DEPLOY_HOST"
          ssh -i ~/.ssh/netcup_myinvoice -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo /usr/local/sbin/netcup-myinvoice-promote promote '$IMAGE_REF' '$SOURCE_SHA'"

      - name: Verify public production health
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          response="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://faktury.dusankahanek.cz/api/health)"
          jq -e --arg version "$VERSION" '.status == "ok" and .db == true and .version == $version' <<<"$response"
