name: CI

on:
  push:
    branches: [development, production]
  pull_request:
    branches: [master, development, production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delivery-data:
    uses: ./.github/workflows/delivery-data.yml
    with:
      base-sha: ${{ github.event.pull_request.base.sha || github.event.before }}
      head-sha: ${{ github.event.pull_request.head.sha || github.sha }}

  backend:
    name: Backend (PHP 8.5 + PHPUnit)
    runs-on: ubuntu-latest

    # Bez databáze se přeskočí celá Integration suita včetně testů atomicity
    # session — tedy zrovna to, co hlídá nejcitlivější garance autentizace.
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: myinvoice_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      # Bez Redisu je RateLimitMiddleware záměrně no-op, takže by se neotestoval
      # ani rate limit, ani brute-force ochrana.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo, pdo_mysql, mbstring, intl, gd, zip, opcache, bcmath, exif
          coverage: none
          tools: composer:v2

      - name: Install composer dependencies
        working-directory: api
        run: composer install --prefer-dist --no-interaction --no-progress

      # cfg.php je gitignored. Používáme stejnou ENV-only cestu jako Docker
      # deploy (prázdný cfg + MYINVOICE_* override), takže se tu netestuje
      # jiná konfigurační větev než v produkci.
      # cfg.php je gitignored, CI si ho generuje. Píšeme ho jako soubor, ne přes
      # MYINVOICE_* proměnné — ty by prosákly i do unit testů Configu, které
      # ověřují právě chování ENV override, a rozbily by je.
      - name: Configure test instance
        run: |
          cat > cfg.php <<'PHPCFG'
          <?php
          return [
              'app' => [
                  'env'   => 'production',
                  'debug' => false,
                  'url'   => 'http://localhost:8080',
                  // Syntetické klíče jen pro běh testů (32 B po dekódování).
                  'pepper'                => base64_encode(str_repeat('p', 32)),
                  'secret_encryption_key' => base64_encode(str_repeat('k', 32)),
              ],
              'db' => [
                  'host' => '127.0.0.1',
                  'port' => 3306,
                  'name' => 'myinvoice_ci',
                  'user' => 'root',
                  'pass' => 'ci',
              ],
              'redis' => [
                  'enabled' => true,
                  'host'    => '127.0.0.1',
                  'port'    => 6379,
                  'prefix'  => 'myinvoice:ci:',
              ],
              'captcha' => ['provider' => 'none'],
          ];
          PHPCFG
          php api/bin/migrate.php
          php api/bin/ci-seed.php

      # Část integračních testů mluví na běžící instanci přes HTTP (bearer auth,
      # rate-limit hlavičky, cross-tenant vazba tokenu). Bez serveru se přeskočí.
      - name: Start test server
        run: |
          php -S 127.0.0.1:8080 api/bin/dev-server-router.php >/tmp/php-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Syntetický testovací server neprošel health checkem"; exit 1

      - name: Run PHPUnit
        working-directory: api
        env:
          MYINVOICE_TEST_URL: http://127.0.0.1:8080
        run: vendor/bin/phpunit --no-coverage

  frontend:
    name: Frontend (Vue + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node 24 + pnpm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        working-directory: web
        run: pnpm exec vue-tsc --noEmit

      - name: PWA service worker tests
        working-directory: web
        run: pnpm test:pwa

      - name: Production build
        working-directory: web
        run: pnpm build

  local-development-contract:
    name: Local Docker contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify local development isolation
        run: bash ops/docker/tests/local-development-contract.sh

  netcup-deploy-contract:
    name: netcup deploy contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify restricted candidate and promote commands
        run: sh ops/deploy/netcup/tests/contract.sh

  local-development-powershell:
    name: Local Docker PowerShell contract
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'cmd/docker-local.ps1'), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Format-List | Out-String) }
          powershell -NoProfile -File ops/docker/tests/local-development-contract.ps1
      - name: Parse with PowerShell 7
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'cmd/docker-local.ps1'), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors | Format-List | Out-String) }
          pwsh -NoProfile -File ops/docker/tests/local-development-contract.ps1

  ci-required:
    name: CI required
    if: ${{ always() }}
    needs:
      - delivery-data
      - backend
      - frontend
      - local-development-contract
      - netcup-deploy-contract
      - local-development-powershell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require success from every mandatory job
        env:
          DELIVERY_DATA: ${{ needs.delivery-data.result }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          DOCKER: ${{ needs.local-development-contract.result }}
          NETCUP: ${{ needs.netcup-deploy-contract.result }}
          POWERSHELL: ${{ needs.local-development-powershell.result }}
        run: python3 ops/security/ci-gate.py "$DELIVERY_DATA" "$BACKEND" "$FRONTEND" "$DOCKER" "$NETCUP" "$POWERSHELL"
