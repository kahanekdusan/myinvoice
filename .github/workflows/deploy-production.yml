name: Build production image

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: myinvoice-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build immutable production image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: SKIP_FRONTEND_TYPECHECK=0
          tags: |
            ghcr.io/kahanekdusan/myinvoice:production
            ghcr.io/kahanekdusan/myinvoice:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/kahanekdusan/myinvoice
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
