name: Build and deploy production

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: myinvoice-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build immutable production image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: SKIP_FRONTEND_TYPECHECK=0
          tags: |
            ghcr.io/kahanekdusan/myinvoice:production
            ghcr.io/kahanekdusan/myinvoice:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy on Docker host
    needs: build
    runs-on: [self-hosted, Windows, X64, myinvoice-production]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Deploy digest with backup, migration and rollback
        shell: powershell
        run: >-
          .\ops\deploy\deploy-production.ps1
          -ImageRef "ghcr.io/kahanekdusan/myinvoice@${{ needs.build.outputs.digest }}"
