name: Build netcup production image

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: myinvoice-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build immutable production image
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/production'
    permissions:
      contents: read
      packages: write
      actions: read
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require successful CI for the exact production commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: python3 ops/security/require-production-ci.py
      - name: Prepare checked build context
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo poppler-utils
          python3 ops/security/install-gitleaks.py "$RUNNER_TEMP/gitleaks"
          PATH="$RUNNER_TEMP:$PATH" python3 ops/security/delivery-check.py context "$RUNNER_TEMP/image-context"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image locally
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: ${{ runner.temp }}/image-context
          outputs: type=oci,dest=${{ runner.temp }}/image.tar,compression=gzip
          provenance: false
          sbom: false
          file: ${{ runner.temp }}/image-context/Dockerfile
          build-args: SKIP_FRONTEND_TYPECHECK=0
          labels: |
            org.opencontainers.image.source=https://github.com/kahanekdusan/myinvoice
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
      - name: Verify manifest, config and every image layer
        id: verified
        run: |
          digest=$(python3 ops/security/delivery-check.py image "$RUNNER_TEMP/image.tar" "$RUNNER_TEMP/image-context")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified image without changing its digest
        id: publish
        env:
          DIGEST: ${{ steps.verified.outputs.digest }}
        run: |
          image=ghcr.io/kahanekdusan/myinvoice
          source="oci-archive:$RUNNER_TEMP/image.tar"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          skopeo copy --preserve-digests "$source" "docker://$image:sha-$GITHUB_SHA"
          skopeo copy --preserve-digests "$source" "docker://$image:production"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

  deploy-candidate:
    name: Deploy inactive candidate on srv01
    # Keep deployment disabled until independent review and a verified staging digest gate exist.
    if: ${{ false }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment: netcup-myinvoice-candidate
    steps:
      - name: Configure verified SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.NETCUP_MYINVOICE_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.NETCUP_MYINVOICE_SSH_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/netcup_myinvoice
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/netcup_myinvoice ~/.ssh/known_hosts

      - name: Deploy immutable image to inactive slot only
        env:
          DEPLOY_HOST: ${{ vars.NETCUP_MYINVOICE_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.NETCUP_MYINVOICE_DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.NETCUP_MYINVOICE_DEPLOY_USER || 'deploy-myinvoice' }}
          IMAGE_REF: ghcr.io/kahanekdusan/myinvoice@${{ needs.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test -n "$DEPLOY_HOST"
          ssh -i ~/.ssh/netcup_myinvoice -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo /usr/local/sbin/netcup-myinvoice-deploy candidate '$IMAGE_REF' '$SOURCE_SHA'"

  promote-production:
    name: Promote candidate to live production
    # Keep deployment disabled until independent review and a verified staging digest gate exist.
    if: ${{ false }}
    needs: [build, deploy-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment: netcup-myinvoice-production
    steps:
      - name: Configure verified SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.NETCUP_MYINVOICE_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.NETCUP_MYINVOICE_SSH_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/netcup_myinvoice
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/netcup_myinvoice ~/.ssh/known_hosts

      - name: Promote the exact healthy candidate
        env:
          DEPLOY_HOST: ${{ vars.NETCUP_MYINVOICE_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.NETCUP_MYINVOICE_DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.NETCUP_MYINVOICE_DEPLOY_USER || 'deploy-myinvoice' }}
          IMAGE_REF: ghcr.io/kahanekdusan/myinvoice@${{ needs.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test -n "$DEPLOY_HOST"
          ssh -i ~/.ssh/netcup_myinvoice -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo /usr/local/sbin/netcup-myinvoice-promote promote '$IMAGE_REF' '$SOURCE_SHA'"

      - name: Verify public production health
        run: |
          response="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://faktury.dusankahanek.cz/api/health)"
          jq -e '.status == "ok" and .db == true' <<<"$response"
