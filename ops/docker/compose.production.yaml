services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "0.0.0.0:${APP_PORT:-8088}:80"
    volumes:
      - ${CFG_PATH:?CFG_PATH is required}:/var/www/html/cfg.php:ro
      - app-data:/data
    environment:
      TZ: Europe/Prague
      MYINVOICE_APP_ENV: production
      MYINVOICE_APP_DEBUG: "false"
      MYINVOICE_APP_URL: https://faktury.dusankahanek.cz
      MYINVOICE_DATA_DIR: /data
      MYINVOICE_ENABLE_CRON: "1"
      MYINVOICE_DB_HOST: db
      MYINVOICE_DB_PORT: "3306"
      MYINVOICE_DB_NAME: ${DB_NAME:-myinvoice}
      MYINVOICE_DB_USER: ${DB_USER:-myinvoice}
      MYINVOICE_DB_PASS: ${DB_PASSWORD:?DB_PASSWORD is required}

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${DB_NAME:-myinvoice}
      MARIADB_USER: ${DB_USER:-myinvoice}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Europe/Prague
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "127.0.0.1:${DB_PORT:-3310}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  app-data:
    external: true
    name: myinvoice_app-data
  db-data:
    external: true
    name: myinvoice_db-data
