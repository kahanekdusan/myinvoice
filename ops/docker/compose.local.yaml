services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    pull_policy: ${APP_PULL_POLICY:-missing}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:?APP_PORT is required}:80"
    volumes:
      - ${CFG_PATH:?CFG_PATH is required}:/var/www/html/cfg.php:ro
      - app-data:/data
    environment:
      TZ: Europe/Prague
      MYINVOICE_APP_ENV: development
      MYINVOICE_APP_DEBUG: "false"
      MYINVOICE_APP_URL: ${APP_URL:?APP_URL is required}
      MYINVOICE_DATA_DIR: /data
      MYINVOICE_ENABLE_CRON: "0"
      MYINVOICE_DB_HOST: db
      MYINVOICE_DB_PORT: "3306"
      MYINVOICE_DB_NAME: ${DB_NAME:-myinvoice}
      MYINVOICE_DB_USER: ${DB_USER:-myinvoice}
      MYINVOICE_DB_PASS: ${DB_PASSWORD:?DB_PASSWORD is required}
      # Fail closed for cloned real data: local stacks cannot send mail.
      MYINVOICE_SMTP_HOST: 127.0.0.1
      MYINVOICE_SMTP_PORT: "1"
      MYINVOICE_SMTP_AUTH: "false"

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${DB_NAME:-myinvoice}
      MARIADB_USER: ${DB_USER:-myinvoice}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Europe/Prague
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "127.0.0.1:${DB_PORT:?DB_PORT is required}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  app-data:
    external: true
    name: ${APP_VOLUME:?APP_VOLUME is required}
  db-data:
    external: true
    name: ${DB_VOLUME:?DB_VOLUME is required}
