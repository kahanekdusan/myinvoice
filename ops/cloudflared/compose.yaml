name: myinvoice_cloudflared

services:
  tunnel:
    image: cloudflare/cloudflared@sha256:a5b5e6fd9a372f054b9a843c219bfbcdceb54691605312a8b1ee72978bdf1aa1
    container_name: cloudflared-nuc-invoices
    restart: unless-stopped
    command:
      - tunnel
      - run
      - --token-file
      - /run/secrets/tunnel-token
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ./tunnel-token
        target: /run/secrets/tunnel-token
        read_only: true
    networks:
      - public-gateway

networks:
  public-gateway:
    external: true
    name: public-gateway
